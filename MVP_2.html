<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EnergyWise — Monitor de Consumo</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#0C0F14;
  --surface:#13181F;
  --surface2:#1A2130;
  --border:#1E2730;
  --border2:#2A3440;
  --green:#00E5A0;
  --green-dim:#00E5A018;
  --green-mid:#00E5A035;
  --red:#FF4D6A;
  --red-dim:#FF4D6A18;
  --amber:#FFB800;
  --amber-dim:#FFB80018;
  --blue:#4D9EFF;
  --blue-dim:#4D9EFF18;
  --text:#EEF0F3;
  --muted:#6B7A8D;
  --muted2:#4A5568;
  --card:#161C24;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ── SHELL ── */
.shell{
  max-width:800px;
  margin:0 auto;
  padding:40px 24px 100px;
}

/* ── BRAND ── */
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:40px;
}
.brand-dot{
  width:9px;height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px var(--green);
  animation:pulse 2.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 14px var(--green);}50%{opacity:.6;box-shadow:0 0 6px var(--green));}}
.brand-name{
  font-family:'Syne',sans-serif;
  font-weight:800;font-size:17px;
  letter-spacing:-.3px;
}
.brand-tag{
  font-size:10px;color:var(--muted);
  background:var(--border2);
  padding:3px 8px;border-radius:20px;
  letter-spacing:.4px;
}

/* ── STEPS ── */
.steps{
  display:flex;align-items:center;
  margin-bottom:36px;
  gap:0;
}
.step-item{
  display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:500;
  color:var(--muted2);
  transition:color .3s;
  white-space:nowrap;
}
.step-item.active{color:var(--green);}
.step-item.done{color:var(--muted);}
.step-num{
  width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-size:11px;font-weight:700;
  transition:all .3s;flex-shrink:0;
}
.step-item.active .step-num{
  border-color:var(--green);
  background:var(--green-dim);color:var(--green);
}
.step-item.done .step-num{
  border-color:var(--border2);
  background:var(--border);color:var(--muted);
}
.step-label{display:block;}
@media(max-width:480px){.step-label{display:none;}}
.step-line{
  flex:1;height:1px;
  background:var(--border2);
  margin:0 10px;min-width:16px;
}

/* ── TYPOGRAPHY ── */
.page-title{
  font-family:'Syne',sans-serif;
  font-size:30px;font-weight:800;
  letter-spacing:-.6px;line-height:1.1;
  margin-bottom:8px;
}
.page-sub{
  font-size:14px;color:var(--muted);
  line-height:1.65;margin-bottom:28px;
  max-width:520px;
}

/* ── CARD ── */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  margin-bottom:14px;
}

/* ── FORM ── */
.field-label{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:500;
  letter-spacing:.7px;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}
.field-label .tip{
  font-size:10px;color:var(--muted2);
  background:var(--border);
  padding:2px 7px;border-radius:10px;
  letter-spacing:0;text-transform:none;font-weight:400;
}
.field-input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:10px;
  padding:13px 16px;
  font-family:'DM Sans',sans-serif;
  font-size:15px;color:var(--text);
  outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
  -webkit-appearance:none;
}
.field-input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px var(--green-dim);
  background:var(--surface2);
}
.field-input::placeholder{color:var(--muted2);}
.field-hint{
  font-size:11px;color:var(--muted);
  margin-top:5px;line-height:1.5;
}
.field-group{margin-bottom:18px;}
.field-group:last-child{margin-bottom:0;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:560px){
  .grid-2,.grid-3{grid-template-columns:1fr;}
}

/* ── BUTTONS ── */
.btn-primary{
  background:var(--green);color:#0a0d10;
  border:none;border-radius:10px;
  padding:14px 28px;
  font-family:'Syne',sans-serif;
  font-size:14px;font-weight:700;
  cursor:pointer;letter-spacing:.1px;
  transition:opacity .2s,transform .1s;
  white-space:nowrap;
}
.btn-primary:hover{opacity:.85;}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}

.btn-ghost{
  background:transparent;color:var(--muted);
  border:1px solid var(--border2);
  border-radius:10px;padding:14px 22px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:500;
  cursor:pointer;
  transition:border-color .2s,color .2s;
  white-space:nowrap;
}
.btn-ghost:hover{border-color:var(--muted);color:var(--text);}

.btn-add{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;
  background:var(--green-dim);
  color:var(--green);
  border:1px dashed #00E5A045;
  border-radius:10px;
  padding:13px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:500;
  cursor:pointer;margin-top:4px;
  transition:background .2s,border-color .2s;
}
.btn-add:hover{background:var(--green-mid);border-color:#00E5A070;}

.btn-remove{
  background:transparent;color:var(--muted);
  border:1px solid transparent;
  border-radius:8px;padding:5px 9px;
  font-size:12px;cursor:pointer;
  transition:color .2s,background .2s,border-color .2s;
}
.btn-remove:hover{color:var(--red);background:var(--red-dim);border-color:#FF4D6A30;}

.btn-row{
  display:flex;gap:12px;
  margin-top:28px;justify-content:flex-end;
  flex-wrap:wrap;
}

/* ── DEVICE CARD ── */
.device-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  margin-bottom:10px;
  transition:border-color .2s;
}
.device-card:focus-within{border-color:var(--border2);}
.device-header{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:14px;
}
.device-num{
  font-family:'Syne',sans-serif;
  font-size:10px;font-weight:700;
  color:var(--green);letter-spacing:.8px;
  text-transform:uppercase;
}
.device-preview{
  font-size:12px;color:var(--muted);
  font-family:'Syne',sans-serif;
  font-weight:600;
}
.device-preview.has-value{color:var(--green);}

/* ── LIVE PREVIEW BAR ── */
.live-bar{
  position:sticky;bottom:0;left:0;right:0;
  background:rgba(12,15,20,.92);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border2);
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
  z-index:100;
}
.live-bar-label{
  font-size:12px;color:var(--muted);
  letter-spacing:.4px;
}
.live-bar-val{
  font-family:'Syne',sans-serif;
  font-size:20px;font-weight:800;
  color:var(--green);letter-spacing:-.5px;
}
.live-bar-note{
  font-size:11px;color:var(--muted);
  margin-top:1px;
}
.live-bar-right{text-align:right;}

/* ── ERROR ── */
.error-box{
  background:var(--red-dim);
  border:1px solid #FF4D6A30;
  border-radius:10px;
  padding:12px 16px;
  font-size:13px;color:var(--red);
  margin-top:12px;
  display:flex;align-items:center;gap:8px;
}

/* ── RESULT ── */
.result-hero{
  border-radius:20px;
  padding:40px 32px;
  margin-bottom:16px;
  text-align:center;
  border:1px solid;
  position:relative;
  overflow:hidden;
}
.result-hero::before{
  content:'';
  position:absolute;inset:0;
  opacity:.04;
  background:radial-gradient(circle at 50% 0%, currentColor 0%, transparent 70%);
  pointer-events:none;
}
.result-hero.ok    {background:var(--green-dim);border-color:#00E5A035;color:var(--green);}
.result-hero.over  {background:var(--red-dim);  border-color:#FF4D6A35;color:var(--red);}
.result-hero.exact {background:var(--amber-dim);border-color:#FFB80035;color:var(--amber);}

.result-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;
  padding:5px 14px;border-radius:20px;
  border:1px solid currentColor;opacity:.7;
  margin-bottom:16px;
}
.result-value{
  font-family:'Syne',sans-serif;
  font-size:58px;font-weight:800;
  line-height:1;letter-spacing:-2.5px;
  margin-bottom:10px;
}
.result-value.green{color:var(--green);}
.result-value.red  {color:var(--red);}
.result-value.amber{color:var(--amber);}
.result-desc{
  font-size:14px;line-height:1.6;
  opacity:.65;max-width:380px;margin:0 auto;
}

/* ── STATS GRID ── */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;margin-bottom:14px;
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr;}
}
.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
}
.stat-label{
  font-size:10px;color:var(--muted);
  letter-spacing:.6px;text-transform:uppercase;
  margin-bottom:8px;line-height:1.4;
}
.stat-val{
  font-family:'Syne',sans-serif;
  font-size:20px;font-weight:700;
  letter-spacing:-.4px;line-height:1.1;
}

/* ── BREAKDOWN ── */
.breakdown-header{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.breakdown-title{
  font-family:'Syne',sans-serif;
  font-size:11px;font-weight:700;
  color:var(--muted);letter-spacing:.8px;
  text-transform:uppercase;
}
.device-row{
  display:flex;align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--border);
  gap:12px;
}
.device-row:last-child{border-bottom:none;}
.device-rank{
  font-family:'Syne',sans-serif;
  font-size:11px;font-weight:700;
  color:var(--muted2);width:20px;
  flex-shrink:0;text-align:center;
}
.device-info{flex:1;min-width:0;}
.device-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.device-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.device-bar-wrap{height:3px;background:var(--border);border-radius:3px;margin-top:7px;overflow:hidden;}
.device-bar-fill{height:100%;border-radius:3px;background:var(--green);transition:width .8s cubic-bezier(.22,1,.36,1);}
.device-cost-col{text-align:right;flex-shrink:0;}
.device-cost{
  font-family:'Syne',sans-serif;
  font-weight:700;font-size:15px;
}
.device-pct{font-size:11px;color:var(--muted);margin-top:2px;}

/* ── PRINT BUTTON ── */
.btn-print{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-top:10px;
  background:var(--blue-dim);
  color:var(--blue);
  border:1px solid #4D9EFF30;
  border-radius:10px;
  padding:13px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:500;
  cursor:pointer;
  transition:background .2s;
}
.btn-print:hover{background:#4D9EFF25;}

.btn-restart{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-top:8px;
  background:transparent;color:var(--muted);
  border:1px solid var(--border2);
  border-radius:10px;padding:13px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;cursor:pointer;
  transition:color .2s,border-color .2s;
}
.btn-restart:hover{color:var(--text);border-color:var(--muted);}

/* ── PRINT STYLES ── */
@media print{
  body{background:#fff;color:#111;}
  .brand-dot{box-shadow:none;}
  .btn-row,.btn-print,.btn-restart,.live-bar{display:none!important;}
  .card,.device-card,.stat-card,.result-hero{
    border-color:#ddd!important;
    background:#f9f9f9!important;
  }
  .result-value,.stat-val,.device-cost,.brand-name{color:#111!important;}
  .result-value.green{color:#00875a!important;}
  .result-value.red{color:#cc2936!important;}
  .result-value.amber{color:#996600!important;}
  .page-title,.section-title{color:#111!important;}
  .device-bar-fill{background:#00875a!important;}
  :root{--muted:#555;--muted2:#777;--border:#ccc;}
}

/* ── ANIMATIONS ── */
.fade-in{animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ── DIVIDER ── */
.section-divider{
  height:1px;background:var(--border);
  margin:24px 0;
}

/* ── INFO CALLOUT ── */
.info-callout{
  background:var(--blue-dim);
  border:1px solid #4D9EFF25;
  border-radius:10px;
  padding:12px 16px;
  font-size:12px;color:var(--blue);
  line-height:1.6;
  margin-bottom:20px;
  display:flex;gap:10px;align-items:flex-start;
}
.info-callout .icon{font-size:14px;flex-shrink:0;margin-top:1px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

const fmt = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtKwh = v => v.toFixed(2).replace('.',',')+' kWh';
const STEPS = ['Empresa','Aparelhos','Resultado'];

/* ── helpers ── */
function calcDevice(d, tarifa, dias){
  const w = parseFloat(d.potencia)||0;
  const h = parseFloat(d.horas)||0;
  const kwh = (w/1000)*h*dias;
  return { kwh, custo: kwh*tarifa };
}

/* ── StepBar ── */
function StepBar({current}){
  return(
    <div className="steps">
      {STEPS.map((s,i)=>(
        <React.Fragment key={i}>
          <div className={`step-item ${i===current?'active':i<current?'done':''}`}>
            <div className="step-num">{i<current?'✓':i+1}</div>
            <span className="step-label">{s}</span>
          </div>
          {i<STEPS.length-1&&<div className="step-line"/>}
        </React.Fragment>
      ))}
    </div>
  );
}

/* ══════════════════════════════
   STEP 1 — Empresa
══════════════════════════════ */
function Step1({onNext}){
  const [empresa,setEmpresa]=useState('');
  const [tarifa,setTarifa]=useState('');
  const [conta,setConta]=useState('');
  const [dias,setDias]=useState('30');
  const [error,setError]=useState('');

  const handle=()=>{
    if(!empresa.trim())        return setError('Informe o nome da empresa.');
    if(!tarifa||+tarifa<=0)    return setError('Informe uma tarifa válida em R$/kWh.');
    if(!conta||+conta<=0)      return setError('Informe o valor da fatura.');
    if(!dias||+dias<=0)        return setError('Informe o número de dias do período.');
    setError('');
    onNext({empresa:empresa.trim(),tarifa:+tarifa,conta:+conta,dias:+dias});
  };

  return(
    <div className="fade-in">
      <p className="page-title">Dados da empresa</p>
      <p className="page-sub">Informe os dados básicos do estabelecimento e da última fatura de energia elétrica.</p>

      <div className="info-callout">
        <span className="icon">💡</span>
        <span>A <strong>tarifa</strong> (R$/kWh) e o <strong>número de dias</strong> do período estão impressos na própria fatura de energia. Caso não encontre, entre em contato com sua distribuidora local.</span>
      </div>

      <div className="card">
        <div className="field-group">
          <label className="field-label">Nome da empresa</label>
          <input className="field-input" placeholder="Ex: Padaria Central, Farmácia do João…" value={empresa} onChange={e=>setEmpresa(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handle()}/>
        </div>

        <div className="grid-2">
          <div className="field-group">
            <label className="field-label">
              Tarifa de energia
              <span className="tip">R$/kWh — na fatura</span>
            </label>
            <input className="field-input" type="number" step="0.001" min="0" placeholder="Ex: 0,856" value={tarifa} onChange={e=>setTarifa(e.target.value)}/>
          </div>
          <div className="field-group">
            <label className="field-label">
              Valor total da fatura
              <span className="tip">R$</span>
            </label>
            <input className="field-input" type="number" step="0.01" min="0" placeholder="Ex: 1.240,00" value={conta} onChange={e=>setConta(e.target.value)}/>
          </div>
        </div>

        <div className="field-group">
          <label className="field-label">
            Dias no período da fatura
            <span className="tip">normalmente 30</span>
          </label>
          <input className="field-input" type="number" min="1" max="31" placeholder="30" value={dias} onChange={e=>setDias(e.target.value)} style={{maxWidth:160}}/>
          <p className="field-hint">Verifique na fatura o período exato de leitura (ex: 28/04 a 28/05 = 30 dias).</p>
        </div>
      </div>

      {error&&<div className="error-box">⚠ {error}</div>}

      <div className="btn-row">
        <button className="btn-primary" onClick={handle}>Continuar →</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════
   STEP 2 — Aparelhos
══════════════════════════════ */
const emptyDev=()=>({id:Date.now()+Math.random(),nome:'',potencia:'',horas:''});

function DeviceCard({d,i,tarifa,dias,onChange,onRemove,canRemove}){
  const {kwh,custo}=calcDevice(d,tarifa,dias);
  const hasVal=d.potencia&&d.horas&&+d.potencia>0&&+d.horas>0;

  return(
    <div className="device-card fade-in">
      <div className="device-header">
        <span className="device-num">Aparelho {String(i+1).padStart(2,'0')}</span>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          {hasVal&&(
            <span className={`device-preview has-value`}>{fmt(custo)}/mês</span>
          )}
          {canRemove&&(
            <button className="btn-remove" onClick={onRemove}>✕ Remover</button>
          )}
        </div>
      </div>

      <div className="grid-3">
        <div className="field-group" style={{marginBottom:0}}>
          <label className="field-label">Nome do aparelho</label>
          <input className="field-input" placeholder="Ex: Ar condicionado" value={d.nome} onChange={e=>onChange('nome',e.target.value)}/>
        </div>
        <div className="field-group" style={{marginBottom:0}}>
          <label className="field-label">
            Potência
            <span className="tip">Watts — na etiqueta</span>
          </label>
          <input className="field-input" type="number" min="0" placeholder="Ex: 1500" value={d.potencia} onChange={e=>onChange('potencia',e.target.value)}/>
        </div>
        <div className="field-group" style={{marginBottom:0}}>
          <label className="field-label">
            Horas de uso/dia
            <span className="tip">0 a 24</span>
          </label>
          <input className="field-input" type="number" min="0" max="24" step="0.5" placeholder="Ex: 8" value={d.horas} onChange={e=>onChange('horas',e.target.value)}/>
        </div>
      </div>
    </div>
  );
}

function Step2({tarifa,dias,onNext,onBack}){
  const [devices,setDevices]=useState([emptyDev()]);
  const [error,setError]=useState('');

  const update=(id,field,val)=>setDevices(prev=>prev.map(d=>d.id===id?{...d,[field]:val}:d));
  const add=()=>setDevices(prev=>[...prev,emptyDev()]);
  const remove=id=>setDevices(prev=>prev.filter(d=>d.id!==id));

  // live total
  const liveTotal=useMemo(()=>devices.reduce((s,d)=>{
    const {custo}=calcDevice(d,tarifa,dias);return s+custo;
  },0),[devices,tarifa,dias]);

  const liveKwh=useMemo(()=>devices.reduce((s,d)=>{
    const {kwh}=calcDevice(d,tarifa,dias);return s+kwh;
  },0),[devices,tarifa,dias]);

  const handle=()=>{
    for(let i=0;i<devices.length;i++){
      const d=devices[i];
      if(!d.nome.trim())               return setError(`Aparelho ${i+1}: informe o nome.`);
      if(!d.potencia||+d.potencia<=0)  return setError(`Aparelho ${i+1}: informe a potência em Watts.`);
      if(!d.horas||+d.horas<=0)        return setError(`Aparelho ${i+1}: informe as horas de uso por dia.`);
      if(+d.horas>24)                  return setError(`Aparelho ${i+1}: máximo de 24 horas por dia.`);
    }
    setError('');
    onNext(devices);
  };

  return(
    <div className="fade-in" style={{paddingBottom:90}}>
      <p className="page-title">Aparelhos do estabelecimento</p>
      <p className="page-sub">Adicione cada equipamento que fica ligado na empresa. A potência em Watts está na etiqueta do aparelho ou no manual.</p>

      <div className="info-callout">
        <span className="icon">📋</span>
        <span>Não sabe a potência de algum aparelho? Valores típicos: geladeira comercial ~300W, ar condicionado split 9000 BTU ~900W, lâmpada LED ~10W, computador ~150W, freezer ~250W.</span>
      </div>

      {devices.map((d,i)=>(
        <DeviceCard
          key={d.id} d={d} i={i}
          tarifa={tarifa} dias={dias}
          onChange={(f,v)=>update(d.id,f,v)}
          onRemove={()=>remove(d.id)}
          canRemove={devices.length>1}
        />
      ))}

      <button className="btn-add" onClick={add}>+ Adicionar aparelho</button>

      {error&&<div className="error-box" style={{marginTop:14}}>⚠ {error}</div>}

      <div className="btn-row">
        <button className="btn-ghost" onClick={onBack}>← Voltar</button>
        <button className="btn-primary" onClick={handle}>Ver resultado →</button>
      </div>

      {/* LIVE BAR */}
      <div className="live-bar">
        <div>
          <p className="live-bar-label">ESTIMATIVA ACUMULADA</p>
          <p className="live-bar-note">{devices.length} aparelho{devices.length!==1?'s':''} · {fmtKwh(liveKwh)}</p>
        </div>
        <div className="live-bar-right">
          <p className="live-bar-val">{fmt(liveTotal)}</p>
          <p className="live-bar-note">custo estimado/mês</p>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════
   STEP 3 — Resultado
══════════════════════════════ */
function Step3({empresa,tarifa,conta,dias,devices,onRestart}){
  const calcs=useMemo(()=>devices.map(d=>{
    const {kwh,custo}=calcDevice(d,tarifa,dias);
    return{...d,kwh,custo};
  }),[devices,tarifa,dias]);

  const totalKwh  = calcs.reduce((s,d)=>s+d.kwh,0);
  const totalCalc = calcs.reduce((s,d)=>s+d.custo,0);
  const diff      = conta-totalCalc;
  const pct       = conta>0?Math.abs(diff/conta*100).toFixed(1):'0';
  const maxCusto  = Math.max(...calcs.map(d=>d.custo),1);

  const sorted=[...calcs].sort((a,b)=>b.custo-a.custo);

  let heroClass,valClass,badge,desc;
  const absDiff=Math.abs(diff);
  if(absDiff<0.5){
    heroClass='exact';valClass='amber';badge='✓ Consumo explicado';
    desc='Os aparelhos cadastrados explicam exatamente o valor da fatura. Nenhum consumo oculto detectado.';
  } else if(diff>0){
    heroClass='over';valClass='red';badge='⚠ Consumo não identificado';
    desc=`Há ${fmt(absDiff)} na sua fatura que os aparelhos cadastrados não explicam. Pode haver equipamentos não listados, consumo em standby elevado ou algum aparelho com defeito consumindo mais do que o normal.`;
  } else {
    heroClass='ok';valClass='green';badge='↓ Abaixo do estimado';
    desc=`O custo estimado dos aparelhos (${fmt(totalCalc)}) é maior que a fatura real. Os equipamentos podem operar menos horas do que o informado, ou há ganhos de eficiência não mapeados.`;
  }

  return(
    <div className="fade-in">
      <p className="page-title">{empresa}</p>
      <p className="page-sub">Análise de consumo energético · Período de {dias} dias</p>

      {/* HERO */}
      <div className={`result-hero ${heroClass}`}>
        <div className="result-badge">{badge}</div>
        <p className={`result-value ${valClass}`}>{diff>0?'+':''}{fmt(diff)}</p>
        <p className="result-desc">{desc}</p>
      </div>

      {/* STATS */}
      <div className="stats-grid">
        <div className="stat-card">
          <p className="stat-label">Valor da fatura</p>
          <p className="stat-val">{fmt(conta)}</p>
        </div>
        <div className="stat-card">
          <p className="stat-label">Estimado pelos aparelhos</p>
          <p className="stat-val">{fmt(totalCalc)}</p>
        </div>
        <div className="stat-card">
          <p className="stat-label">Consumo estimado</p>
          <p className="stat-val">{fmtKwh(totalKwh)}</p>
        </div>
        <div className="stat-card">
          <p className="stat-label">Diferença percentual</p>
          <p className="stat-val" style={{color:diff>0.5?'var(--red)':diff<-0.5?'var(--green)':'var(--amber)'}}>{pct}%</p>
        </div>
      </div>

      {/* BREAKDOWN */}
      <div className="card">
        <div className="breakdown-header">
          <p className="breakdown-title">Consumo por aparelho</p>
          <p style={{fontSize:11,color:'var(--muted)'}}>ordenado por custo</p>
        </div>
        {sorted.map((d,i)=>{
          const barW=maxCusto>0?(d.custo/maxCusto*100).toFixed(1)+'%':'0%';
          const pctOfBill=conta>0?(d.custo/conta*100).toFixed(1):'0';
          return(
            <div className="device-row" key={d.id||i}>
              <span className="device-rank">#{i+1}</span>
              <div className="device-info">
                <p className="device-name">{d.nome}</p>
                <p className="device-meta">{d.potencia}W · {d.horas}h/dia · {fmtKwh(d.kwh)}</p>
                <div className="device-bar-wrap">
                  <div className="device-bar-fill" style={{width:barW}}/>
                </div>
              </div>
              <div className="device-cost-col">
                <p className="device-cost">{fmt(d.custo)}</p>
                <p className="device-pct">{pctOfBill}% da fatura</p>
              </div>
            </div>
          );
        })}
      </div>

      {/* ACTIONS */}
      <button className="btn-print" onClick={()=>window.print()}>
        🖨️ Imprimir / Salvar PDF
      </button>
      <button className="btn-restart" onClick={onRestart}>
        ↩ Nova análise
      </button>
    </div>
  );
}

/* ══════════════════════════════
   APP ROOT
══════════════════════════════ */
function App(){
  const [step,setStep]=useState(0);
  const [s1,setS1]=useState(null);
  const [devices,setDevices]=useState(null);

  const restart=()=>{setS1(null);setDevices(null);setStep(0);};

  return(
    <div className="shell">
      <div className="brand">
        <div className="brand-dot"/>
        <span className="brand-name">EnergyWise</span>
        <span className="brand-tag">MVP</span>
      </div>
      <StepBar current={step}/>

      {step===0&&<Step1 onNext={d=>{setS1(d);setStep(1);}}/>}
      {step===1&&s1&&(
        <Step2
          tarifa={s1.tarifa} dias={s1.dias}
          onNext={devs=>{setDevices(devs);setStep(2);}}
          onBack={()=>setStep(0)}
        />
      )}
      {step===2&&s1&&devices&&(
        <Step3 {...s1} devices={devices} onRestart={restart}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
